name: Backup semanal de la base de datos

# El plan gratuito de Supabase no incluye backups automáticos.
# Este workflow hace un pg_dump cifrado cada domingo y lo guarda como artefacto (90 días).
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     cadena de conexión directa (Session pooler, puerto 5432)
#   BACKUP_PASSPHRASE   contraseña para cifrar el archivo (guárdala en un lugar seguro)

on:
  schedule:
    - cron: "0 9 * * 0" # domingos 03:00 hora de Honduras
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17

      - name: Dump y cifrado
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          FILE="backup-$(date -u +%Y-%m-%d).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --schema=auth --no-owner --no-privileges | gzip > "$FILE"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$FILE.gpg" "$FILE"
          rm "$FILE"
          ls -lh "$FILE.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup-*.sql.gz.gpg
          retention-days: 90
