[build]
  # Prepara la base de datos (solo lo que falte) y luego compila.
  command = "npm run setup-db && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Netlify detecta Next.js y usa su runtime oficial (OpenNext) automáticamente.

[functions]
  directory = "netlify/functions"
