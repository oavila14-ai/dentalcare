<!doctype html>
<html lang="es">
  <body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px -12px rgba(15,23,42,.18)">
          <tr><td style="background:#0ea5a4;background-image:linear-gradient(120deg,#0ea5a4,#22d3ee 45%,#6366f1);padding:28px 32px;color:#ffffff">
            <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9">Consultorio dental</div>
            <div style="font-size:24px;font-weight:700;margin-top:6px">Restablece tu contraseña</div>
          </td></tr>
          <tr><td style="padding:32px">
            <p style="margin:0 0 16px;font-size:16px;line-height:1.6">Recibimos un pedido para restablecer la contraseña de tu cuenta. El enlace vence en 1 hora.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0"><tr><td style="border-radius:12px;background:#0ea5a4;background-image:linear-gradient(120deg,#0ea5a4,#6366f1)">
              <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/restablecer" style="display:inline-block;padding:14px 28px;color:#ffffff;font-weight:600;font-size:15px;text-decoration:none">Crear nueva contraseña</a>
            </td></tr></table>
            <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b">Si no lo pediste, ignora este correo: tu contraseña no cambiará.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
